services:
  - type: web
    name: royce-booking-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: ZENDESK_WIDGET_KEY
        sync: false
